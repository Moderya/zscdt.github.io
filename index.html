        start: { size: [46, 55], url: "https://webapi.amap.com/theme/v1.3/markers/n/mark_r.png", anchor: 'bottom-center' }
      },
      routeColor: { walk: '#009688', ride: '#1e88e5', drive: '#f44336' }
    };

    const getDom = (id) => document.getElementById(id);

    const closeAllInfoWindows = (infoWindows) => {
      infoWindows.forEach(window => window.close());
      infoWindows.length = 0;
    };

    class SmartCampusMap {
      constructor() {
        this.map = null;
        this.AMap = null;
        this.markers = [];
        this.infoWindows = [];
        this.routeLayers = [];
        this.currentRouteType = 'drive';
        this.startPoint = null;
        this.startMarker = null;
        this.normalIcon = null;
        this.startIcon = null;
        this.planIsOpen = false;
        this.planTipsEl = getDom('planTips');
      }

      async init() {
        try {
          this.AMap = await AMapLoader.load({
            key: CONFIG.amapKey,
            version: "2.0",
            plugins: ['AMap.ToolBar', 'AMap.Scale', 'AMap.HawkEye', 'AMap.MapType', 'AMap.InfoWindow', 'AMap.Geolocation', 'AMap.Walking', 'AMap.Riding', 'AMap.Driving']
          });

          this.map = new this.AMap.Map("container", {
            viewMode: '3D',
            zoom: CONFIG.campus.zoom,
            center: CONFIG.campus.center,
            pitch: CONFIG.campus.pitch,
            rotation: CONFIG.campus.rotation,
            mapStyle: 'amap://styles/light'
          });

          this.initIcons();
          this.addMapLayers();
          this.addMapControls();
          this.renderMarkers();
          this.renderSidebar();
          this.hideLoading();
          this.adjustMapView();
          this.bindAllEvents();
        } catch (error) {
          console.error('❌ 导航地图初始化过程中出现异常:', error);
          this.showError('地图加载未能成功完成，请尝试刷新页面或检查当前网络连接状况');
        }
      }

      initIcons() {
        const { normal, start } = CONFIG.iconConfig;
        this.normalIcon = new this.AMap.Icon({
          size: new this.AMap.Size(...normal.size),
          image: normal.url,
          imageSize: new this.AMap.Size(...normal.size),
          anchor: normal.anchor
        });
        this.startIcon = new this.AMap.Icon({
          size: new this.AMap.Size(...start.size),
          image: start.url,
          imageSize: new this.AMap.Size(...start.size),
          anchor: start.anchor
        });
      }

      addMapLayers() {
        const layers = [
          new this.AMap.TileLayer.Traffic({ autoRefresh: true }),
          new this.AMap.Buildings({ heightFactor: 1.2 }),
          new this.AMap.TileLayer.Satellite(),
          new this.AMap.TileLayer.RoadNet()
        ];
        this.map.add(layers);
      }

      addMapControls() {
        const controls = [
          new this.AMap.ToolBar({ position: 'RT' }),
          new this.AMap.Scale({ position: 'LB' }),
          new this.AMap.HawkEye({ isOpen: true, position: 'RB' }),
          new this.AMap.MapType({ defaultType: 0, position: 'RT' }),
          new this.AMap.Geolocation({ position: 'LB', showCircle: false })
        ];
        this.map.add(controls);
      }

      renderMarkers() {
        const { spots, center, name, intro } = CONFIG.campus;

        // 校园中心点标记
        const mainMarker = new this.AMap.Marker({
          position: center,
          icon: this.normalIcon,
          anchor: CONFIG.iconConfig.normal.anchor,
          zIndex: 100
        });
        const mainInfoWindow = new this.AMap.InfoWindow({
          content: this.getCampusInfoContent(name, intro),
          offset: new this.AMap.Pixel(0, -100),
          closeWhenClickMap: true
        });

        mainMarker.on('click', () => {
          closeAllInfoWindows(this.infoWindows);
          mainInfoWindow.open(this.map, center);
          this.infoWindows.push(mainInfoWindow);
        });
        this.map.add(mainMarker);
        this.markers.push(mainMarker);

        // 校园点位标记（优化路径规划逻辑）
        spots.forEach(spot => {
          const marker = new this.AMap.Marker({
            position: spot.position,
            icon: this.normalIcon,
            anchor: CONFIG.iconConfig.normal.anchor,
            title: spot.name,
            extData: spot,
            zIndex: 90
          });

          const infoWindow = new this.AMap.InfoWindow({
            content: this.getSpotInfoContent(spot),
            offset: new this.AMap.Pixel(0, -60),
            closeWhenClickMap: true
          });

          marker.on('click', () => {
            closeAllInfoWindows(this.infoWindows);
            infoWindow.open(this.map, spot.position);
            this.infoWindows.push(infoWindow);
            this.map.setCenter(spot.position);
            this.map.setZoom(18);

            // 优化路径规划状态流转逻辑
            if (this.planIsOpen) {
              // 1. 未设置起点：将当前点位设为路线起点
              if (this.startPoint === null) {
                this.startPoint = spot;
                this.startMarker = marker;
                marker.setIcon(this.startIcon);
                // 提示用户后续操作
                const routeName = this.currentRouteType === 'drive' ? '驾车' : this.currentRouteType === 'ride' ? '骑行' : '步行';
                this.planTipsEl.innerHTML = `🟢 已成功将【${spot.name}】设为路线起点 → 点击另一处目标点位即可自动生成${routeName}导航路线`;
              } 
              // 2. 已设置起点且点击不同点位：执行路线规划
              else if (this.startPoint.id !== spot.id) {
                const routeName = this.currentRouteType === 'drive' ? '驾车' : this.currentRouteType === 'ride' ? '骑行' : '步行';
                this.planTipsEl.innerHTML = `🟢 系统正在生成【${this.startPoint.name}】→【${spot.name}】的${routeName}导航路线...`;
                // 发起路线规划请求
                this.searchRoute(this.startPoint.position, spot.position);
                // 规划完成后重置起点状态
                this.startMarker.setIcon(this.normalIcon);
                this.startPoint = null;
                this.startMarker = null;
              }
              // 3. 点击已选定的起点：取消该起点设置
              else {
                marker.setIcon(this.normalIcon);
                this.startPoint = null;
                this.startMarker = null;
                this.planTipsEl.innerHTML = '🟢 路线规划功能已激活 → 点击地图上任意点位，首个点位将设为起点，再次点击其他点位将自动生成导航路线';
              }
            }
          });

          this.map.add(marker);
          this.markers.push(marker);
        });
      }

      getCampusInfoContent(campusName, campusIntro) {
        return `<div style="width: 320px; padding: 15px;">
                  <h3 style="color: #009688; margin: 0 0 10px 0; font-size: 16px;">${campusName}</h3>
                  <p style="margin: 0; color: #666; line-height: 1.7; font-size: 14px; white-space: pre-line;">
                    ${campusIntro}<br/><br/>
                    📍 校区亮点：校园依山而建，原生林木资源丰富，覆盖范围广泛，教学设施与生活配套完善齐全，是一座集学习深造、科研创新、生活休闲于一体的生态化校园。<br/>
                    📚 核心优势：林学、风景园林两大专业为国家级特色专业，依托多个省级林业科研平台与实践教学基地，形成鲜明的办学特色。
                  </p>
                </div>`;
      }

      getSpotInfoContent(spot) {
        return `<div style="width: 340px; padding: 15px; border-radius: 8px;">
                  <h4 style="color: #009688; margin: 0 0 10px 0; font-size: 16px; font-weight: bold;">${spot.name}</h4>
                  <p style="margin: 0; color: #333; line-height: 1.7; font-size: 14px; white-space: pre-line;">${spot.fullDesc}</p>
                  <div style="margin-top:12px;font-size:12px;color:#888;text-align:right;">点击地图空白处即可关闭当前信息窗口</div>
                </div>`;
      }

      renderSidebar() {
        const campusIntroEl = getDom('campus-intro');
        const spotListEl = getDom('spot-list');
        const { intro, spots } = CONFIG.campus;

        campusIntroEl.textContent = intro.replace(/\n/g, ' ');
        spotListEl.innerHTML = spots.map(spot => 
          `<div class="spot-item" onclick="campusMap.flyToSpot(${spot.id})">
            <strong>${spot.name}</strong>
            <p>${spot.desc.substring(0, 40)}...</p>
          </div>`
        ).join('');
      }

      flyToSpot(spotId) {
        const spot = CONFIG.campus.spots.find(s => s.id === spotId);
        if (!spot) return;

        this.map.setCenter(spot.position);
        this.map.setZoom(18);
        const marker = this.markers.find(m => m.getExtData()?.id === spotId);
        marker && marker.emit('click');
      }

      adjustMapView() {
        if (this.markers.length > 0) {
          this.map.setFitView(this.markers, false, [80, 80, 80, 80]);
        }
      }

      hideLoading() {
        getDom('loading').style.display = 'none';
      }

      showError(message) {
        const loadingEl = getDom('loading');
        loadingEl.innerHTML = `<div style="text-align:center;color:#f44336;">
          <div style="font-size:48px;margin-bottom:20px;">⚠️</div>
          <h3>地图加载失败</h3>
          <p>${message}</p>
          <button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#009688;color:white;border:none;border-radius:5px;cursor:pointer;">点击重新加载</button>
        </div>`;
      }

      bindAllEvents() {
        this.bindPlanSwitchEvent();
        this.bindRouteTypeEvent();
        this.bindClearRouteEvent();
        this.bindWindowResizeEvent();
      }

      bindPlanSwitchEvent() {
        const switchBtn = getDom('planSwitch');
        switchBtn.addEventListener('click', () => {
          this.planIsOpen = !this.planIsOpen;
          if (this.planIsOpen) {
            switchBtn.classList.add('open');
            switchBtn.innerText = '关闭路径规划';
            this.planTipsEl.innerHTML = '🟢 路线规划功能已激活 → 点击地图上任意点位，首个点位设为起点，再次点击其他点位自动生成导航路线（注：因校园内部距离较近，路线规划功能存在一定使用限制）';
          } else {
            switchBtn.classList.remove('open');
            switchBtn.innerText = '开启路径规划';
            this.planTipsEl.innerHTML = '✅ 路线规划功能已关闭 → 当前仅支持查看地图点位信息，暂不提供路线导航服务';
            this.clearRouteLayer();
            if (this.startMarker) {
              this.startMarker.setIcon(this.normalIcon);
            }
            this.startPoint = null;
            this.startMarker = null;
          }
        });
      }

      bindRouteTypeEvent() {
        const btns = document.querySelectorAll('.route-btn');
        btns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            if (!this.planIsOpen) return;

            btns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            this.currentRouteType = e.target.dataset.type;

            // 切换路线类型后，若已设置起点则重新规划路线
            if (this.startPoint) {
              const start = this.startPoint.position;
              const currentCenter = this.map.getCenter();
              this.clearRouteLayer();
              this.searchRoute(start, currentCenter);
            }
          });
        });
      }

      bindClearRouteEvent() {
        getDom('clearRoute').addEventListener('click', () => {
          this.clearRouteLayer();
          if (this.startMarker) {
            this.startMarker.setIcon(this.normalIcon);
          }
          this.startPoint = null;
          this.startMarker = null;
          // 重置提示文本内容
          if (this.planIsOpen) {
            this.planTipsEl.innerHTML = '🟢 路线规划功能已激活 → 点击地图上任意点位，首个点位设为起点，再次点击其他点位自动生成导航路线';
          }
        });
      }

      bindWindowResizeEvent() {
        window.addEventListener('resize', () => {
          if (this.map && this.markers.length > 0) {
            this.map.setFitView(this.markers, false, [80, 80, 80, 80]);
          }
        });
      }

      clearRouteLayer() {
        this.routeLayers.forEach(layer => this.map.remove(layer));
        this.routeLayers.length = 0;
      }

      // 优化路径规划查询逻辑，完善错误处理机制
      searchRoute(start, end) {
        this.clearRouteLayer();
        let planner = null;
        const { AMap } = this;
        const routeName = this.currentRouteType === 'drive' ? '驾车' : this.currentRouteType === 'ride' ? '骑行' : '步行';

        // 根据选择的路线类型创建对应规划实例
        switch (this.currentRouteType) {
          case 'walk':
            planner = new AMap.Walking({
              map: this.map,
              policy: AMap.WalkingPolicy.LEAST_DISTANCE,
              avoidRoad: true,
              showTraffic: false
            });
            break;
          case 'ride':
            planner = new AMap.Riding({
              map: this.map,
              policy: AMap.RidingPolicy.LEAST_TIME
            });
            break;
          case 'drive':
            planner = new AMap.Driving({
              map: this.map,
              policy: AMap.DrivingPolicy.LEAST_TIME
            });
            break;
          default:
            planner = new AMap.Driving({
              map: this.map,
              policy: AMap.DrivingPolicy.LEAST_TIME
            });
        }

        // 调用高德地图API发起路线规划请求，增加错误捕获机制
        planner.search([{ location: start }, { location: end }], (status, result) => {
          if (status === 'complete' && result.routes && result.routes.length > 0) {
            this.renderRouteLine(result.routes[0].path);
            this.planTipsEl.innerHTML = `✅ 【${routeName}】导航路线生成成功 → 如需重新规划，可点击清除路线按钮后再次操作`;
          } else {
            console.warn(`❌ ${routeName}路线规划请求未能成功响应，状态码：${status}，返回结果：`, result);
            this.renderFailRouteLine(start, end);
            this.planTipsEl.innerHTML = `⚠️ ${routeName}路线规划失败，已为您生成直连参考线路 → 建议尝试切换其他路线类型后重新规划`;
          }
        });
      }

      renderRouteLine(path) {
        const routeColor = CONFIG.routeColor[this.currentRouteType];
        let pathStyle = {};

        if (this.currentRouteType === 'walk') {
          pathStyle = {
            path,
            strokeColor: routeColor,
            strokeWeight: 6,
            strokeOpacity: 0.9,
            strokeStyle: 'solid',
            borderWeight: 2,
            zIndex: 999,
            lineJoin: 'round',
            lineCap: 'round'
          };
        } else {
          pathStyle = {
            path,
            strokeColor: routeColor,
            strokeWeight: 8,
            strokeOpacity: 0.85,
            strokeStyle: 'solid',
            borderWeight: 1,
            zIndex: 999,
            lineJoin: 'round',
            lineCap: 'round'
          };
        }

        const polyline = new this.AMap.Polyline(pathStyle);
        this.map.add(polyline);
        this.routeLayers.push(polyline);

        this.map.setFitView(this.routeLayers.concat(this.markers), false, [50, 50, 50, 50]);
        this.map.setZoom(18);
      }

      renderFailRouteLine(start, end) {
        let failColor = "#ff6666";
        if (this.currentRouteType === 'walk') {
          failColor = CONFIG.routeColor.walk;
        }

        const directLine = new this.AMap.Polyline({
          path: [start, end],
          strokeColor: failColor,
          strokeWeight: this.currentRouteType === 'walk' ? 5 : 6,
          strokeOpacity: 0.7,
          strokeStyle: "dashed",
          zIndex: 999,
          lineJoin: 'round',
          lineCap: 'round'
        });

        this.map.add(directLine);
        this.routeLayers.push(directLine);
        this.map.setFitView([start, end], false, [30, 30, 30, 30]);
      }
    }

    // 全局导航地图实例
    let campusMap;

    // 页面DOM元素加载完成后初始化地图
    document.addEventListener('DOMContentLoaded', () => {
      campusMap = new SmartCampusMap();
      campusMap.init();
      window.campusMap = campusMap;
    });
  </script>
</body>
</html>
